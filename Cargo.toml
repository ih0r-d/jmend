[package]
name = "jmend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jmend"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", features = ["derive"] }
log = "0.4.33"
quick-xml = "0.41.0"
ristretto_classfile = "0.33.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
