name: Snapshot Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: jmend
            archive: jmend-linux-x86_64.tar.gz

          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: jmend
            archive: jmend-linux-arm64.tar.gz

          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: jmend
            archive: jmend-macos-arm64.tar.gz

          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: jmend
            archive: jmend-macos-x86_64.tar.gz

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: jmend.exe
            archive: jmend-windows-x86_64.zip

          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: jmend.exe
            archive: jmend-windows-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/jmend
          tar -C dist -czf "${{ matrix.archive }}" jmend

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/jmend.exe"
          Compress-Archive -Path "dist/jmend.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7