version: '3'

vars:
  BINARY: jmend

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: Check project compilation
    cmds:
      - cargo check

  fmt:
    desc: Format Rust sources
    cmds:
      - cargo fmt

  fmt-check:
    desc: Verify Rust formatting
    cmds:
      - cargo fmt --check

  lint:
    desc: Run Clippy with warnings treated as errors
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run all tests
    cmds:
      - cargo test

  verify:
    desc: Run all project verification checks
    cmds:
      - task: fmt-check
      - task: check
      - task: lint
      - task: test

  build:
    desc: Build JMend in debug mode
    cmds:
      - cargo build --bin {{.BINARY}}

  build-release:
    desc: Build JMend in release mode
    cmds:
      - cargo build --release --bin {{.BINARY}}

  run:
    desc: Run JMend
    cmds:
      - cargo run --bin {{.BINARY}} -- {{.CLI_ARGS}}

  run-check:
    desc: Run JMend check command
    cmds:
      - cargo run --bin {{.BINARY}} -- check

  playground:
    desc: Run Rust playground
    cmds:
      - cargo run --bin playground

  install:
    desc: Install JMend locally
    cmds:
      - cargo install --path . --force

  clean:
    desc: Remove Cargo build artifacts
    cmds:
      - cargo clean